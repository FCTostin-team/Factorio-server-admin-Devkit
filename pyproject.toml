[project]
name = "factorio-admin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
    "python-telegram-bot>=20.7",
    "slack-bolt>=1.18",
    "websockets>=12.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
factorio-admin = "factorio_admin.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
